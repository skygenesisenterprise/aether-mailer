packages:
  - apps/*
  - packages/*
  - web
  - web/apps/*
  - templates/app
  - templates/build-scripts

ignoredBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - '@vscode/vsce-sign'
  - core-js
  - free-email-domains
  - prisma

onlyBuiltDependencies:
  - '@scarf/scarf'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - bcrypt
  - better-sqlite3
  - core-js-pure
  - cpu-features
  - esbuild
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter
  - tree-sitter-json

overrides:
  '@better-fetch/fetch': 1.3.1
  '@types/react': 18.3.5
  '@types/react-dom': 18.3.0
  better-call: 1.3.7
  esbuild: 0.20.2
  protobufjs: '>=7.5.5 <8.0.0'
  tar: '>=7.5.19 <8.0.0'

peerDependencyRules:
  ignoreMissing:
    - prisma
    - '@prisma/client'
    - '@prisma/engines'
    - '@electric-sql/pglite'
    - typescript
    - drizzle-kit
