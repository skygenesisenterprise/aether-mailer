name: Opencode

# Runs the opencode agent on a pull request when a maintainer comments
# `/opencode` on a review thread.
#
# The action authenticates through an OpenCode App OIDC token exchange, not an
# API key, and reads the request from the triggering event. Security notes,
# because this executes a third-party action against the repository:
#   * Only `pull_request_review_comment` is handled. `issue_comment` fires for
#     every comment on every issue in the repository, including from anonymous
#     outside contributors.
#   * `author_association` is checked, so only OWNER / MEMBER / COLLABORATOR
#     accounts can start a run.
#   * `use_github_token: true` skips the OIDC exchange, so the job never needs
#     `id-token: write`, and the token it does get is the read-only one granted
#     below: the agent can comment on a pull request but cannot push commits.
on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: opencode-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  opencode:
    name: opencode
    if: >-
      ${{
        contains(github.event.comment.body, '/opencode') &&
        contains(github.event.comment.body, github.actor) &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the model to be configured
        env:
          MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          if [ -z "$MODEL" ]; then
            echo "::error::The OPENCODE_MODEL repository variable is not set. Set it to a model id your OpenCode account can use (provider-qualified), otherwise the action would start with an undefined model."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          # The agent works on the checked-out tree only; do not leave a token in
          # .git/config.
          persist-credentials: false

      # TODO(supply-chain): pin this to a commit SHA. It is a third-party
      # composite action that runs arbitrary shell (it curls the opencode
      # installer), so a mutable tag means unreviewed code execution.
      - uses: anomalyco/opencode/github@latest
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          # Skip the OIDC token exchange: the read-only GITHUB_TOKEN is enough
          # and it avoids granting id-token: write to the job.
          use_github_token: true
          # Addressed to a specific person, so a drive-by comment elsewhere on
          # the thread cannot start a run.
          prompt: ${{ github.event.comment.body }}
