name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 03:23 UTC. Off the hour on purpose: the top of the hour is
    # when every other scheduled workflow on GitHub runs.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Actions workflows.
          - language: actions
            build-mode: none
          # TypeScript/JS: the workspace is compiled ahead of the analysis and
          # the sources are handed to CodeQL directly. `none` build mode is
          # correct here — there is no single build command for the monorepo and
          # an autobuild attempt is slow and unreliable. Scoped to the packages
          # that contain TypeScript.
          - language: javascript-typescript
            build-mode: none
          # Go: a single module, so autobuild works.
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        if: matrix.language == 'javascript-typescript'
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate
          pnpm install --frozen-lockfile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Dependency vendoring is not used: the TypeScript analysis reads
          # sources directly and the Go module downloads its own dependencies.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
