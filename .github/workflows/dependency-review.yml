name: Dependency Review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Reject new GPL-family licences and anything with no licence at all.
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0, unlicensed
          # Anything landing in these scopes is unreviewed by the maintainers.
          fail-on-scopes: runtime
