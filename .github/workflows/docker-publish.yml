name: Docker Publish

# Publishes the product container images to the GitHub Container Registry.
#
#   GitHub Actions -> Buildx -> GHCR -> cosign (keyless)
#
# Publishing is tag-only. Each package has its own `v<major>.<minor>.<patch>`
# tag suffix (for example, `v1.2.3-cloud` publishes only `notploy-cloud`).
#
# Every suffix also publishes a GitHub Release, titled `Notploy {Suffix}
# v{major}.{minor}.{patch}` (`Notploy App v1.2.3`, `Notploy Cloud v1.2.3`,
# `Notploy Console v1.2.3`, `Notploy Status v1.2.3`, `Notploy MCP v1.2.3`, ...),
# so a release always reads the same way whatever image it advertises. The
# suffix label and the assets a release carries come from the catalog in
# `select`, which is the single place to add an image.
#
# Only the self-hosted `-app` release is published as GitHub's `latest`: a
# running server discovers its updates through the Releases API and pulls the
# image whose tag is that release tag, and install.sh resolves
# `/releases/latest` to pick a version. The other releases therefore carry
# `make_latest: false` so they never take that place. `-app`, `-cloud` and
# `-console` additionally ship the install scripts, which install those products.
#
# The `select` job filters the catalog down to the images the pushed tag
# actually publishes, so `v1.0.2-app` shows one job instead of the whole
# catalog (the other entries stay disabled). Adding an image means adding it to
# the catalog in `select` and adding its suffix to the tag filters above. The
# build context is always the repository root because the whole monorepo is a
# single pnpm workspace.
#
# Pull requests do not run this workflow at all: ci.yml's `docker` job already
# builds the images (amd64, no push) so a pull request stays fast and this job
# can hold `packages: write` without ever being reachable from a fork. That is
# also why the permissions below are granted to the job rather than to the
# workflow.
on:
  push:
    tags:
      - "v*.*.*-app"
      - "v*.*.*-cloud"
      - "v*.*.*-console"
      - "v*.*.*-status"
      - "v*.*.*-mcp"
      - "v*.*.*-github"
      - "v*.*.*-website"
      - "v*.*.*-docs"
      - "v*.*.*-templates"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ghcr.io/<owner>/<image>. Override with the IMAGE_PREFIX repository variable
  # to publish under a different owner (or a mirror on forks).
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  # The pushed tag selects exactly one image (`v1.0.2-app` publishes only
  # `notploy`). The matrix is filtered here rather than letting every job
  # disable itself, so a tag push shows a single job in the run instead of
  # seven, six of them no-ops.
  select:
    name: Select images for the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      version: ${{ steps.select.outputs.version }}
      release_title: ${{ steps.select.outputs.release_title }}
      release_assets: ${{ steps.select.outputs.release_assets }}
      release_latest: ${{ steps.select.outputs.release_latest }}
    steps:
      - name: Select the images published by ${{ github.ref_name }}
        id: select
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(app|cloud|console|status|mcp|github|website|docs|templates)$ ]]; then
            echo "::error::Unsupported Docker image tag: $TAG_NAME"
            exit 1
          fi
          version="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          variant="${BASH_REMATCH[4]}"

          # Catalog of publishable images. Adding an image means adding it here
          # and adding its suffix to the tag filters above.
          #
          # `release_name` is the label the GitHub Release is titled with
          # (`Notploy {release_name} {version}`) and `release_assets` says
          # whether that release carries the install scripts.
          #
          # `platforms` defaults to linux/amd64,linux/arm64 when omitted.
          read -r -d '' CATALOG <<'JSON' || true
          [
            {
              "image": "notploy",
              "file": "./Dockerfile",
              "target": "selfhosted",
              "platforms": "linux/amd64",
              "tag_suffix": "-app",
              "description": "Notploy self-hosted (dashboard, server and build tooling)",
              "release_name": "App",
              "release_assets": true
            },
            {
              "image": "notploy-cloud",
              "file": "./Dockerfile",
              "target": "cloud",
              "tag_suffix": "-cloud",
              "description": "Notploy Cloud (dashboard + server)",
              "release_name": "Cloud",
              "release_assets": true
            },
            {
              "image": "notploy-console",
              "file": "./Dockerfile",
              "target": "console",
              "tag_suffix": "-console",
              "description": "Notploy Console (instance and fleet management)",
              "release_name": "Console",
              "release_assets": true
            },
            {
              "image": "notploy-status",
              "file": "./Dockerfile",
              "target": "status",
              "tag_suffix": "-status",
              "description": "Notploy Status (status page, incidents and uptime history)",
              "release_name": "Status",
              "release_assets": false
            },
            {
              "image": "notploy-mcp",
              "file": "./packages/mcp/Dockerfile",
              "tag_suffix": "-mcp",
              "description": "Notploy MCP server",
              "release_name": "MCP",
              "release_assets": false
            },
            {
              "image": "notploy-github",
              "file": "./packages/github/Dockerfile",
              "tag_suffix": "-github",
              "description": "Notploy GitHub integration",
              "release_name": "GitHub",
              "release_assets": false
            },
            {
              "image": "notploy-website",
              "file": "./web/Dockerfile.website",
              "platforms": "linux/amd64",
              "tag_suffix": "-website",
              "description": "Notploy official website",
              "release_name": "Website",
              "release_assets": false
            },
            {
              "image": "notploy-docs",
              "file": "./web/Dockerfile.docs",
              "tag_suffix": "-docs",
              "description": "Notploy documentation",
              "release_name": "Docs",
              "release_assets": false
            },
            {
              "image": "notploy-templates",
              "file": "./templates/Dockerfile",
              "tag_suffix": "-templates",
              "description": "Notploy templates gallery",
              "release_name": "Templates",
              "release_assets": false
            }
          ]
          JSON

          selected=$(jq -c --arg suffix "-$variant" '[ .[] | select(.tag_suffix == $suffix) ]' <<< "$CATALOG")

          if [ "$(jq 'length' <<< "$selected")" -eq 0 ]; then
            echo "::error::No image publishes the '$variant' variant"
            exit 1
          fi

          release_name="$(jq -r '.[0].release_name' <<< "$selected")"
          if [ -z "$release_name" ] || [ "$release_name" = "null" ]; then
            echo "::error::The '$variant' image has no release_name in the catalog"
            exit 1
          fi

          echo "any=true" >> "$GITHUB_OUTPUT"
          # The release fields are for the `release` job only: the build matrix
          # does not need them.
          echo "matrix=$(jq -c 'map(del(.release_name, .release_assets))' <<< "$selected")" >> "$GITHUB_OUTPUT"
          echo "release_title=Notploy $release_name $version" >> "$GITHUB_OUTPUT"
          echo "release_assets=$(jq -r '.[0].release_assets' <<< "$selected")" >> "$GITHUB_OUTPUT"

          # The self-hosted release is the one a running server and install.sh
          # resolve through `/releases/latest`; no other suffix may take it.
          if [ "$variant" = "app" ]; then
            echo "release_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_latest=false" >> "$GITHUB_OUTPUT"
          fi

          jq -r '.[] | "::notice::publishing \(.image) from \(.file)"' <<< "$selected"

  publish:
    name: ${{ matrix.image }}
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing mints a short-lived OIDC token to Fulcio; without
      # this the sign step fails with "no OIDC token found".
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # cosign (keyless signing) needs the full tag history to resolve the
          # commit that an image was built from.
          fetch-depth: 0

      - name: Check the image can be built
        id: select
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -euo pipefail

          # An image can be listed before its Dockerfile lands; it is then
          # reported and left out instead of failing the whole matrix.
          if [ ! -f "$DOCKERFILE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping $IMAGE: '$DOCKERFILE' does not exist yet"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        if: steps.select.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}.{{patch}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ needs.select.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,suffix=${{ matrix.tag_suffix }},value=${{ needs.select.outputs.version }}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=skygenesisenterprise
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/setup-buildx-action@v4
        if: steps.select.outputs.enabled == 'true'

      - name: Log in to ${{ env.IMAGE_PREFIX }}
        if: steps.select.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_PREFIX }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build
        if: steps.select.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Install cosign
        if: steps.select.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: steps.select.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Signing every tag would burn a Fulcio/OIDC certificate per tag; the
          # digest is what consumers actually pin to, so sign that once.
          cosign sign --yes \
            "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${DIGEST}"

      - name: Upload image metadata
        if: steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: image-metadata-${{ matrix.image }}
          path: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.labels }}
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish the ${{ needs.select.outputs.release_title }} release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The image must be pullable before the release advertises it, otherwise a
    # server that already sees the release could be offered a missing tag.
    needs: [select, publish]
    permissions:
      contents: write
    steps:
      # Only the releases that ship the install scripts need the sources; the
      # action resolves the tag through the API.
      - name: Checkout
        if: needs.select.outputs.release_assets == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare release assets
        id: assets
        env:
          RELEASE_ASSETS: ${{ needs.select.outputs.release_assets }}
        run: |
          set -euo pipefail

          # install.sh installs the self-hosted, cloud and console products, so
          # it rides along with those three releases.
          if [ "$RELEASE_ASSETS" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp install.sh install-notploy.sh
          chmod +x install.sh install-notploy.sh
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Idempotent: re-running the workflow updates the existing release instead
      # of failing on a tag that already has one.
      - name: Publish the ${{ needs.select.outputs.release_title }} release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.select.outputs.release_title }}
          generate_release_notes: true
          # Keeps `/releases/latest` (what install.sh and the running servers
          # resolve) on the self-hosted release.
          make_latest: ${{ needs.select.outputs.release_latest }}
          fail_on_unmatched_files: ${{ steps.assets.outputs.enabled == 'true' }}
          # The blank lines collapse to nothing, so a release without assets
          # publishes no file instead of failing on an unmatched glob.
          files: |
            ${{ steps.assets.outputs.enabled == 'true' && 'install.sh' || '' }}
            ${{ steps.assets.outputs.enabled == 'true' && 'install-notploy.sh' || '' }}
